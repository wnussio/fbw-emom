# Publikuje plan FBW + EMOM na GitHub Pages przy każdej zmianie.
name: Wersja na telefon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Składanie strony
        run: |
          mkdir _site
          cp fbw-emom.html _site/index.html
          cp pwa/manifest.webmanifest pwa/icon-192.png pwa/icon-512.png _site/
          sed "s/__VERSION__/${GITHUB_SHA::7}/" pwa/sw.js > _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
